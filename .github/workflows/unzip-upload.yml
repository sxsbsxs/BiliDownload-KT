- name: Extract ZIP files
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import pathlib
          import zipfile
          import shutil
          import stat
          import tempfile

          root = pathlib.Path(".").resolve()
          incoming = root / "incoming"

          archives = []
          if incoming.exists():
              archives.extend(incoming.glob("*.zip"))
          archives.extend(root.glob("*.zip"))
          archives = sorted(set(archives))

          if not archives:
              raise SystemExit("No ZIP files found.")

          required = {
              "settings.gradle",
              "build.gradle",
              "gradle.properties"
          }

          for archive in archives:
              print("Processing:", archive.name)

              with zipfile.ZipFile(archive) as z:
                  files = {}

                  for item in z.infolist():
                      name = item.filename.replace("\\", "/")
                      path = pathlib.PurePosixPath(name)

                      if path.is_absolute() or ".." in path.parts:
                          raise Exception("Unsafe ZIP path: " + name)

                      if not path.parts or item.is_dir():
                          continue

                      mode = item.external_attr >> 16
                      if stat.S_ISLNK(mode):
                          raise Exception("Symbolic link rejected: " + name)

                      files[path] = item

                  # Locate Android project root at any directory depth.
                  project_roots = set()

                  for path in files:
                      if path.name in required:
                          parent = path.parent
                          if all(
                              parent / filename in files
                              for filename in required
                          ):
                              project_roots.add(parent)

                  if len(project_roots) != 1:
                      raise Exception(
                          "Could not identify exactly one Android project root. "
                          "Found: " + str(project_roots)
                      )

                  project_root = next(iter(project_roots))
                  print("Android project root inside ZIP:", project_root)

                  for path, item in files.items():
                      if project_root.parts and path.parts[:len(project_root.parts)] != project_root.parts:
                          continue

                      relative = path.relative_to(project_root)
                      if not relative.parts:
                          continue

                      target = (root / pathlib.Path(*relative.parts)).resolve()

                      if target != root and root not in target.parents:
                          raise Exception("Invalid extraction path")

                      target.parent.mkdir(parents=True, exist_ok=True)

                      with z.open(item) as src, open(target, "wb") as dst:
                          shutil.copyfileobj(src, dst)

              archive.unlink()
              print("Deleted ZIP:", archive.name)

          print("Extraction completed.")
          PY
