name: Auto Unzip Uploaded Folder

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Target branch"
        required: true
        default: "main"

permissions:
  contents: write
  actions: write

concurrency:
  group: unzip-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unzip:
    name: Extract ZIP and Commit
    runs-on: ubuntu-22.04

    steps:
      # 1. 获取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          fetch-depth: 0

      # 2. 自动寻找 ZIP、识别项目根目录并解压
      - name: Extract ZIP files
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import pathlib
          import zipfile
          import shutil
          import stat

          root = pathlib.Path(".").resolve()
          incoming = root / "incoming"

          archives = []

          if incoming.exists():
              archives.extend(incoming.glob("*.zip"))

          archives.extend(root.glob("*.zip"))
          archives = sorted(set(archives))

          if not archives:
              print("No ZIP files found.")
              raise SystemExit(0)

          required = [
              "settings.gradle",
              "settings.gradle.kts",
              "build.gradle",
              "build.gradle.kts",
              "gradle.properties",
              "app/build.gradle",
              "app/build.gradle.kts",
              "app/src/main/AndroidManifest.xml"
          ]

          total = 0

          for archive in archives:
              print("Processing:", archive.relative_to(root))

              with zipfile.ZipFile(archive) as z:
                  entries = []

                  for item in z.infolist():
                      name = item.filename.replace("\\", "/")
                      path = pathlib.PurePosixPath(name)

                      if (
                          path.is_absolute()
                          or ".." in path.parts
                          or (path.parts and ":" in path.parts[0])
                      ):
                          raise Exception("Unsafe ZIP path: " + name)

                      if not path.parts:
                          continue

                      mode = item.external_attr >> 16

                      if stat.S_ISLNK(mode):
                          raise Exception("Symbolic link rejected: " + name)

                      entries.append((item, path))

                  available = {
                      str(path)
                      for item, path in entries
                      if not item.is_dir()
                  }

                  # 查找真正的 Android 项目根目录
                  project_roots = set()

                  for item, path in entries:
                      if path.name not in (
                          "settings.gradle",
                          "settings.gradle.kts"
                      ):
                          continue

                      parent = path.parent

                      checks = [
                          (parent / "build.gradle").as_posix(),
                          (parent / "build.gradle.kts").as_posix(),
                          (parent / "gradle.properties").as_posix(),
                          (parent / "app/build.gradle").as_posix(),
                          (parent / "app/build.gradle.kts").as_posix(),
                          (parent / "app/src/main/AndroidManifest.xml").as_posix()
                      ]

                      has_root_build = (
                          checks[0] in available
                          or checks[1] in available
                      )

                      has_app_build = (
                          checks[3] in available
                          or checks[4] in available
                      )

                      if (
                          has_root_build
                          and checks[2] in available
                          and has_app_build
                          and checks[5] in available
                      ):
                          project_roots.add(parent)

                  if len(project_roots) == 0:
                      print("Could not detect a complete Android project.")
                      print("settings.gradle files found:")

                      for item, path in entries:
                          if path.name in (
                              "settings.gradle",
                              "settings.gradle.kts"
                          ):
                              print(" -", path)

                      raise Exception(
                          "Android project root not found in ZIP."
                      )

                  if len(project_roots) > 1:
                      raise Exception(
                          "Multiple Android project roots found: "
                          + str(project_roots)
                      )

                  project_root = next(iter(project_roots))

                  print("Detected Android project root:", project_root)

                  # 只解压项目根目录以内的文件
                  for item, path in entries:
                      if item.is_dir():
                          continue

                      if path.parts[:len(project_root.parts)] != project_root.parts:
                          continue

                      parts = path.parts[len(project_root.parts):]

                      if not parts:
                          continue

                      target = root.joinpath(*parts)

                      # 防止路径逃逸
                      resolved = target.resolve()

                      if resolved != root and root not in resolved.parents:
                          raise Exception("Invalid extraction path: " + str(target))

                      target.parent.mkdir(parents=True, exist_ok=True)

                      with z.open(item) as src:
                          with open(target, "wb") as dst:
                              shutil.copyfileobj(src, dst)

                      total += 1

                      if total > 20000:
                          raise Exception("Too many files in ZIP.")

              # 解压成功后删除 ZIP
              archive.unlink()
              print("Deleted ZIP:", archive.name)

          print("Successfully extracted:", total, "files")
          PY

      # 3. 检查 Android 项目文件
      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Project file list:"
          find . -maxdepth 5 -type f \
            ! -path "./.git/*" | sort

          # 支持 Groovy 和 Kotlin DSL
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "MISSING: settings.gradle or settings.gradle.kts"
            exit 1
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "MISSING: build.gradle or build.gradle.kts"
            exit 1
          fi

          if [ ! -f "gradle.properties" ]; then
            echo "MISSING: gradle.properties"
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "MISSING: app/build.gradle or app/build.gradle.kts"
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "MISSING: app/src/main/AndroidManifest.xml"
            exit 1
          fi

          echo "All Android project files found."

      # 4. 自动提交解压后的项目
      - name: Commit extracted files
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git commit -m "Auto extract BiliDownload-KT project"
            git push origin "HEAD:${GITHUB_REF_NAME}"

            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 5. 自动触发 APK 构建
      - name: Trigger APK build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh workflow run build-helper.yml \
            --ref "${GITHUB_REF_NAME}"
