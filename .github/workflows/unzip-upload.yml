name: Auto Unzip Uploaded Folder

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Target branch"
        required: true
        default: "main"

permissions:
  contents: write
  actions: write

concurrency:
  group: unzip-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unzip:
    name: Extract ZIP and Commit
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Extract ZIP files
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import pathlib
          import zipfile
          import shutil
          import stat

          root = pathlib.Path(".").resolve()
          incoming = root / "incoming"

          archives = []
          if incoming.exists():
              archives.extend(incoming.glob("*.zip"))
          archives.extend(root.glob("*.zip"))
          archives = sorted(set(archives))

          if not archives:
              print("No ZIP files found.")
              raise SystemExit(0)

          total = 0

          for archive in archives:
              print("Processing:", archive.relative_to(root))

              with zipfile.ZipFile(archive) as z:
                  entries = []

                  for item in z.infolist():
                      name = item.filename.replace("\\", "/")
                      path = pathlib.PurePosixPath(name)

                      if (
                          path.is_absolute()
                          or ".." in path.parts
                          or (path.parts and ":" in path.parts[0])
                      ):
                          raise Exception("Unsafe ZIP path: " + name)

                      if not path.parts:
                          continue

                      mode = item.external_attr >> 16
                      if stat.S_ISLNK(mode):
                          raise Exception("Symbolic link rejected: " + name)

                      entries.append((item, path))

                  available = {
                      str(path)
                      for item, path in entries
                      if not item.is_dir()
                  }

                  project_roots = set()

                  for item, path in entries:
                      if path.name not in (
                          "settings.gradle",
                          "settings.gradle.kts"
                      ):
                          continue

                      parent = path.parent

                      root_build = (
                          (parent / "build.gradle").as_posix() in available
                          or (parent / "build.gradle.kts").as_posix() in available
                      )

                      app_build = (
                          (parent / "app/build.gradle").as_posix() in available
                          or (parent / "app/build.gradle.kts").as_posix() in available
                      )

                      has_properties = (
                          (parent / "gradle.properties").as_posix() in available
                      )

                      has_manifest = (
                          (parent / "app/src/main/AndroidManifest.xml").as_posix()
                          in available
                      )

                      if root_build and app_build and has_properties and has_manifest:
                          project_roots.add(parent)

                  if len(project_roots) != 1:
                      raise Exception(
                          "Expected exactly one complete Android project root, found: "
                          + str(project_roots)
                      )

                  project_root = next(iter(project_roots))
                  print("Detected Android project root:", project_root)

                  for item, path in entries:
                      if item.is_dir():
                          continue

                      if path.parts[:len(project_root.parts)] != project_root.parts:
                          continue

                      parts = path.parts[len(project_root.parts):]
                      if not parts:
                          continue

                      target = root.joinpath(*parts)
                      resolved = target.resolve()

                      if resolved != root and root not in resolved.parents:
                          raise Exception("Invalid extraction path: " + str(target))

                      target.parent.mkdir(parents=True, exist_ok=True)

                      with z.open(item) as src, open(target, "wb") as dst:
                          shutil.copyfileobj(src, dst)

                      total += 1
                      if total > 20000:
                          raise Exception("Too many files in ZIP.")

              archive.unlink()
              print("Deleted ZIP:", archive.name)

          print("Successfully extracted:", total, "files")
          PY

      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          check_any() {
            for file in "$@"; do
              if [ -f "$file" ]; then
                echo "FOUND: $file"
                return 0
              fi
            done
            echo "MISSING: one of: $*"
            return 1
          }

          check_any settings.gradle settings.gradle.kts
          check_any build.gradle build.gradle.kts
          test -f gradle.properties
          check_any app/build.gradle app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "All Android project files found."

      - name: Commit extracted files
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git commit -m "Auto extract BiliDownload-KT project"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger APK build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run build-helper.yml --ref "${GITHUB_REF_NAME}"
