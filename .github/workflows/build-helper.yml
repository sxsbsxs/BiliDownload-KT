name: Build BiliDownload-KT APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/build-helper.yml"

permissions:
  contents: read

jobs:
  python-tests:
    name: Python engine tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Python unit tests
        run: |
          python -m unittest discover -s app/src/test/python -p "test_*.py" -v

  android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "latest"
          accept-android-sdk-licenses: true
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate Gradle wrapper
        run: |
          test -f gradlew
          chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BiliDownload-KT-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
